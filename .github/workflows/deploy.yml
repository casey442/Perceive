name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Netlify (production)
        # netlify-cli's dependency tree is currently un-installable (sub-packages
        # pin unpublished @netlify/* versions), so deploy the built dist straight to
        # Netlify's zip-upload API with curl. No npm deps, nothing to break.
        run: |
          ( cd dist && zip -r -q /tmp/site.zip . )
          echo "Uploading $(du -h /tmp/site.zip | cut -f1) to Netlify..."
          code=$(curl -sS -o /tmp/ntl-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/site.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          echo "HTTP $code"; head -c 500 /tmp/ntl-resp.json; echo
          test "$code" -ge 200 -a "$code" -lt 300
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
